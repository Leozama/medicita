<div
  class="min-h-screen flex items-center justify-center bg-gradient-to-br from-blue-50 to-blue-100 py-12 px-4 sm:px-6 lg:px-8"
>
  <div class="max-w-md w-full space-y-8">
    <!-- Header -->
    <div class="text-center">
      <div class="flex justify-center items-center space-x-3 mb-6">
        <div class="w-12 h-12 bg-blue-600 rounded-full flex items-center justify-center">
          <span class="text-white font-bold text-2xl">L</span>
        </div>
        <h1 class="text-3xl font-bold text-gray-900">CentroMédico</h1>
      </div>
      <h2 class="mt-2 text-2xl font-bold text-gray-900">Crear Perfil de Paciente</h2>
      <p class="mt-2 text-gray-600">Completa tus datos para registrarte</p>
    </div>

    <!-- Formulario -->
    <form class="mt-8 space-y-6" (ngSubmit)="onSubmit()" #registroForm="ngForm">
      <div class="space-y-4">
        <!-- Nombre -->
        <div>
          <label for="nombre" class="block text-sm font-medium text-gray-700 mb-2"> Nombre </label>
          <input
            id="nombre"
            name="nombre"
            type="text"
            [(ngModel)]="usuario.nombre"
            required
            pattern="[A-Za-zÁÉÍÓÚáéíóúÑñ ]+"
            title="Solo letras y espacios permitidos"
            class="appearance-none relative block w-full px-3 py-3 border border-gray-300 placeholder-gray-500 text-gray-900 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 sm:text-sm"
            placeholder="Juan"
          />
        </div>

        <!-- Apellido -->
        <div>
          <label for="apellido" class="block text-sm font-medium text-gray-700 mb-2">
            Apellido
          </label>
          <input
            id="apellido"
            name="apellido"
            type="text"
            [(ngModel)]="usuario.apellido"
            required
            pattern="[A-Za-zÁÉÍÓÚáéíóúÑñ ]+"
            title="Solo letras y espacios permitidos"
            class="appearance-none relative block w-full px-3 py-3 border border-gray-300 placeholder-gray-500 text-gray-900 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 sm:text-sm"
            placeholder="Pérez"
          />
        </div>

        <!-- Correo Electrónico -->
        <div>
          <label for="email" class="block text-sm font-medium text-gray-700 mb-2">
            Correo Electrónico
          </label>
          <input
            id="email"
            name="email"
            type="email"
            [(ngModel)]="usuario.email"
            required
            pattern="^[^\s@]+@[^\s@]+\.[^\s@]+$"
            title="Introduce un correo válido, ejemplo: usuario@dominio.com"
            class="appearance-none relative block w-full px-3 py-3 border border-gray-300 placeholder-gray-500 text-gray-900 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 sm:text-sm"
            placeholder="tu@email.com"
          />
        </div>

        <!-- Fecha de Nacimiento -->
        <div>
          <label for="fechaNacimiento" class="block text-sm font-medium text-gray-700 mb-2">
            Fecha de Nacimiento
          </label>
          <input
            id="fechaNacimiento"
            name="fechaNacimiento"
            type="date"
            [(ngModel)]="usuario.fechaNacimiento"
            required
            (keydown)="$event.preventDefault()"
            [attr.max]="today"
            class="appearance-none relative block w-full px-3 py-3 border border-gray-300 placeholder-gray-500 text-gray-900 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 sm:text-sm"
          />
        </div>

        <!-- Contraseña -->
        <div>
          <label for="password" class="block text-sm font-medium text-gray-700 mb-2">
            Contraseña
          </label>
          <div class="relative">
            <input
              id="password"
              name="password"
              [type]="showPassword ? 'text' : 'password'"
              [(ngModel)]="usuario.password"
              required
              minlength="6"
              class="appearance-none relative block w-full px-3 py-3 pr-10 border border-gray-300 placeholder-gray-500 text-gray-900 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 sm:text-sm"
              placeholder="Ingresa tu contraseña"
            />
            <button
              type="button"
              (click)="showPassword = !showPassword"
              class="absolute inset-y-0 right-0 pr-3 flex items-center"
            >
              <span class="text-gray-500 text-sm">{{ showPassword ? 'Ocultar' : 'Mostrar' }}</span>
            </button>
          </div>
          <p class="text-xs text-gray-500 mt-1">La contraseña debe tener al menos 6 caracteres</p>
        </div>

        <!-- Teléfono -->
        <div>
          <label for="telefono" class="block text-sm font-medium text-gray-700 mb-2">
            Teléfono
          </label>
          <input
            id="telefono"
            name="telefono"
            type="tel"
            [(ngModel)]="usuario.telefono"
            required
            class="appearance-none relative block w-full px-3 py-3 border border-gray-300 placeholder-gray-500 text-gray-900 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 sm:text-sm"
            placeholder="+34 600 000 000"
          />
        </div>

        <!-- Username -->
        <div>
          <label for="username" class="block text-sm font-medium text-gray-700 mb-2">
            Username
          </label>
          <input
            id="username"
            name="username"
            type="text"
            [(ngModel)]="usuario.username"
            required
            class="appearance-none relative block w-full px-3 py-3 border border-gray-300 placeholder-gray-500 text-gray-900 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 sm:text-sm"
            placeholder="juanperez"
          />
        </div>
      </div>

      <!-- Botón de Registro -->
      <div>
        <button
          type="submit"
          [disabled]="loading"
          class="group relative w-full flex justify-center py-3 px-4 border border-transparent text-sm font-medium rounded-lg text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-colors disabled:bg-blue-400 disabled:cursor-not-allowed"
        >
          <svg
            *ngIf="loading"
            class="animate-spin -ml-1 mr-3 h-5 w-5 text-white"
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
          >
            <circle
              class="opacity-25"
              cx="12"
              cy="12"
              r="10"
              stroke="currentColor"
              stroke-width="4"
            ></circle>
            <path
              class="opacity-75"
              fill="currentColor"
              d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"
            ></path>
          </svg>
          <span>{{ loading ? 'Creando cuenta...' : 'Crear Cuenta' }}</span>
        </button>
      </div>

      <!-- Enlace a Login -->
      <div class="text-center">
        <span class="text-gray-600">¿Ya tienes cuenta?</span>
        <button
          type="button"
          (click)="irALogin()"
          class="ml-2 text-blue-600 hover:text-blue-500 font-medium"
        >
          Iniciar sesión
        </button>
      </div>

      <!-- Mensaje de error -->
      <div *ngIf="error" class="rounded-md bg-red-50 p-4">
        <div class="flex">
          <div class="flex-shrink-0">
            <span class="text-red-400">❌</span>
          </div>
          <div class="ml-3">
            <h3 class="text-sm font-medium text-red-800">Error al crear la cuenta</h3>
            <div class="mt-2 text-sm text-red-700">
              <p>{{ error }}</p>
            </div>
          </div>
        </div>
      </div>
    </form>
  </div>
</div>

<!-- Popup de Registro Exitoso -->
<div
  *ngIf="mostrarPopupExito"
  class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50"
>
  <div class="bg-white rounded-2xl shadow-xl max-w-sm w-full p-6 text-center">
    <!-- Icono de éxito -->
    <div class="w-16 h-16 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-4">
      <svg class="w-8 h-8 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M5 13l4 4L19 7"
        ></path>
      </svg>
    </div>

    <!-- Mensaje -->
    <h3 class="text-xl font-bold text-gray-900 mb-2">¡Registro Exitoso!</h3>
    <p class="text-gray-600 mb-6">
      Tu cuenta ha sido creada correctamente. Ahora puedes iniciar sesión con tus credenciales.
    </p>

    <!-- Botón OK -->
    <button
      (click)="cerrarPopupYRedirigir()"
      class="w-full bg-blue-600 text-white py-3 px-4 rounded-lg font-semibold hover:bg-blue-700 transition-colors focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2"
    >
      OK
    </button>
  </div>
</div>
