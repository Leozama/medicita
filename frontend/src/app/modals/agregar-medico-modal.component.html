<!-- features/medicos/components/modals/agregar-medico-modal/agregar-medico-modal.component.html -->
<div
  *ngIf="mostrarModal"
  class="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50"
>
  <div class="bg-white rounded-2xl shadow-xl max-w-2xl w-full max-h-[90vh] overflow-y-auto">
    <!-- Header del Modal -->
    <div class="bg-blue-600 text-white p-6 rounded-t-2xl">
      <div class="flex justify-between items-center">
        <h3 class="text-2xl font-bold">Agregar Nuevo Médico</h3>
        <button 
          (click)="onCerrar()" 
          class="text-white hover:text-blue-200 transition-colors"
        >
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M6 18L18 6M6 6l12 12"
            />
          </svg>
        </button>
      </div>
    </div>

    <!-- Formulario -->
    <form (ngSubmit)="onGuardar()" #medicoForm="ngForm" class="p-6 space-y-6">
      <!-- Nombre y Apellido -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2"> Nombre * </label>
          <input
            type="text"
            [(ngModel)]="nuevoMedico.nombre"
            name="nombre"
            required
            pattern="[A-Za-zÁÉÍÓÚáéíóúÑñ ]+"
            title="Solo letras y espacios"
            (keypress)="allowOnlyLetters($event)"
            (paste)="handlePaste($event, 'nombre')"
            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
            placeholder="Ej: Juan"
          />
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2"> Apellido * </label>
          <input
            type="text"
            [(ngModel)]="nuevoMedico.apellido"
            name="apellido"
            required
            pattern="[A-Za-zÁÉÍÓÚáéíóúÑñ ]+"
            title="Solo letras y espacios"
            (keypress)="allowOnlyLetters($event)"
            (paste)="handlePaste($event, 'apellido')"
            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
            placeholder="Ej: Pérez García"
          />
        </div>
      </div>

      <!-- Especialidad -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2"> Especialidad * </label>
        <select
          [(ngModel)]="nuevoMedico.especialidad"
          name="especialidad"
          required
          class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
        >
          <option value="">Selecciona una especialidad</option>
          <option value="Cardiología">Cardiología</option>
          <option value="Neurología">Neurología</option>
          <option value="Pediatría">Pediatría</option>
          <option value="Odontología">Odontología</option>
          <option value="Oftalmología">Oftalmología</option>
          <option value="Ortopedia">Ortopedia</option>
        </select>
      </div>
      
      <!-- Horario de Atención - REQUERIDO -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">
          Horario de Atención (Lunes a Viernes) *
        </label>
        <div class="grid grid-cols-2 gap-4">
          <!-- Hora de inicio -->
          <div>
            <label class="block text-xs text-gray-600 mb-1">Hora de inicio</label>
            <select
              [(ngModel)]="nuevoMedico.horaInicio"
              name="horaInicio"
              required
              (change)="validarHorario()"
              class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
            >
              <option value="">Selecciona</option>
              <option *ngFor="let hora of horasDisponibles" [value]="hora">
                {{ hora }}
              </option>
            </select>
          </div>

          <!-- Hora de fin -->
          <div>
            <label class="block text-xs text-gray-600 mb-1">Hora de fin</label>
            <select
              [(ngModel)]="nuevoMedico.horaFin"
              name="horaFin"
              required
              (change)="validarHorario()"
              class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
            >
              <option value="">Selecciona</option>
              <option *ngFor="let hora of horasDisponibles" [value]="hora">
                {{ hora }}
              </option>
            </select>
          </div>
        </div>
        <p class="text-xs text-gray-500 mt-1">
          Los médicos atienden de Lunes a Viernes en el horario seleccionado
        </p>
        <p *ngIf="horarioInvalido" class="text-xs text-red-600 mt-1">
          La hora de inicio debe ser anterior a la hora de fin.
        </p>
      </div>

      <!-- Botones del Formulario -->
      <div class="flex space-x-4 pt-4">
        <button
          type="button"
          (click)="onCerrar()"
          class="flex-1 bg-gray-500 text-white py-3 px-6 rounded-lg font-semibold hover:bg-gray-600 transition-colors"
        >
          Cancelar
        </button>
        <button
          type="submit"
          class="flex-1 bg-blue-600 text-white py-3 px-6 rounded-lg font-semibold hover:bg-blue-700 transition-colors"
        >
          Guardar Médico
        </button>
      </div>
    </form>
  </div>
</div>
